services:
  api:
    build:
      context: .
      dockerfile: tests/e2e/api.Dockerfile
    volumes:
      - ./tests/e2e/api.yaml:/src/config/config.yaml:ro
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
  frontend:
    depends_on: [api]
    ports: !override ["127.0.0.1::80"]
    volumes:
      - ./tests/e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  mysql:
    ports: !override ["127.0.0.1::3306"]
  redis:
    ports: !override ["127.0.0.1::6379"]
  kafka:
    ports: !reset []

# Each invocation owns these volumes even when the developer's .env selects existing volumes.
volumes:
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME}-mysql
  redis-data:
    name: ${COMPOSE_PROJECT_NAME}-redis
  kafka-data:
    name: ${COMPOSE_PROJECT_NAME}-kafka
