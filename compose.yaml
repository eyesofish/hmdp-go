services:
  frontend:
    image: nginx:stable-alpine
    profiles: [web]
    ports:
      - "127.0.0.1:${HMDP_WEB_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hmdp
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${HMDP_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "-uroot", "hmdp", "-e", "SELECT 1 FROM tb_shop_type LIMIT 1"]
      interval: 5s
      timeout: 4s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${HMDP_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:${HMDP_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:${HMDP_KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    post_start:
      - command: /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic voucher-order-topic --partitions 1 --replication-factor 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--describe", "--topic", "voucher-order-topic"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  mysql-data:
    name: ${HMDP_MYSQL_VOLUME:-${COMPOSE_PROJECT_NAME}_mysql-data}
  redis-data:
    name: ${HMDP_REDIS_VOLUME:-${COMPOSE_PROJECT_NAME}_redis-data}
  kafka-data:
    name: ${HMDP_KAFKA_VOLUME:-${COMPOSE_PROJECT_NAME}_kafka-data}
